<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <!-- 화면 떨림 방지 및 모바일 최적화 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>인공지능수학 수행평가</title>
    
    <!-- React, ReactDOM, Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <!-- KaTeX for Math formatting -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>

    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f3f4f6;
            -webkit-tap-highlight-color: transparent;
        }
        
        .blank-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 60px;
            height: 32px;
            padding: 0 12px;
            margin: 0 4px;
            border-radius: 4px;
            border: 2px dashed #4b5563; 
            background-color: #ffffff;
            color: #111827;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            vertical-align: middle;
        }
        .blank-btn.filled {
            border-style: solid;
            background-color: #111827; 
            color: white;
            border-color: #111827;
        }
        .bottom-sheet {
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: translateY(100%);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .katex { font-size: 1.1em; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        /* ==========================================
           [필수 설정] 여기에 앱스 스크립트 웹 앱 URL을 붙여넣으세요!
           ========================================== */
        const GAS_URL = "https://script.google.com/macros/s/AKfycbzo3r9NJ-G3azQlUUmJMNhIqJiKkG-5857m9bbp6GfOspDqwiPLd9GffJTpY7lR1jhP0w/exec"; 
        
        // 백엔드 통신 래퍼 (낙관적 처리를 위해 비동기 래핑)
        const api = {
            post: async (action, payload = {}) => {
                if (GAS_URL === "여기에_웹앱_URL을_붙여넣으세요") {
                    console.warn("GAS_URL이 설정되지 않아 로컬 모드로 동작합니다.");
                    return { success: true, data: null };
                }
                try {
                    // CORS Preflight(OPTIONS) 문제를 우회하기 위해 Content-Type을 text/plain으로 전송
                    const res = await fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action, payload })
                    });
                    return await res.json();
                } catch (e) {
                    console.error("API 통신 오류:", e);
                    return { success: false };
                }
            }
        };

        const SEED_QUESTIONS = [
            {
                id: 'sec_1',
                title: '01. 텍스트 자료의 표현 및 처리',
                wordBank: '빈도수\n성분\n시각화\n정형\n자료\n비정형\n낮은\n벡터\n높은\n단어 구름',
                content: `• 관찰이나 측정 등을 통해 얻게 되는 가공되지 않은 정보를 ( {{자료}} )라고 한다.
• ( {{정형}} ) 자료는 일정한 형식을 갖춘 자료이고,
• ( {{비정형}} ) 자료는 일정한 형식을 갖추지 않은 자료이다.

• 텍스트 자료는 집합이나 ( {{벡터}} )로 나타낼 수 있다.
• $n$개의 수 $x_1, x_2, \\cdots, x_n$을 괄호 속에 순서대로 나열하여 나타낸
  $\\vec{X} = (x_1, x_2, \\cdots, x_n)$ 을 벡터라 하고, $x_1, x_2, \\cdots, x_n$을 벡터 $\\vec{X}$의 ( {{성분}} )이라고 한다.

• 비정형 텍스트 자료에서 단어의 ( {{빈도수}} )를 구하면 그 자료에서 주제어를 찾을 수 있다.

• 단어 빈도수를 이용하여 TF·IDF를 구하면 텍스트 자료의 유용한 정보를 알아낼 수 있다.
• TF·IDF가 작으면 중요도가 ( {{낮은}} ) 단어이고, TF·IDF가 크면 중요도가 ( {{높은}} ) 단어이다.

• 자료의 분석 결과를 쉽게 이해할 수 있도록 시각적으로 표현하여 효과적으로 전달하는 과정을 ( {{시각화}} )라고 한다.
• 텍스트 자료는 단어 빈도수를 이용하여 표, 막대그래프, 원그래프, ( {{단어 구름}} ) 등으로 시각화할 수 있다.`
            },
            {
                id: 'sec_2',
                title: '02. 이미지 자료의 표현 및 처리',
                wordBank: '0\n실수배\n1\n덧셈과 뺄셈\na_{ij}\n평균\n(R,G,B)\n곱셈\n행렬',
                content: `• 수 또는 문자를 직사각형 모양으로 배열하여 괄호로 묶은 것을 ( {{행렬}} )이라고 한다.
• 행렬 $A$의 제 $i$행과 제 $j$열이 만나는 위치에 있는 성분을 행렬 $A$의 $(i, j)$ 성분이라 하고, 기호로 ( {{a_{ij}}} )와 같이 나타낸다.

• 흑백 이미지는 각 픽셀에서 검은색은 ( {{0}} ), 흰색은 255로 나타내고, 그 사이의 회색은 ( {{1}} )부터 254까지의 수로 나타낼 수 있다.
• 컬러 이미지에서 각 픽셀의 색상 정보는 RGB 채널의 광원의 세기를 나타내는 수를 ( {{(R,G,B)}} )의 순서쌍으로 나타낸다.

• 이미지를 합성하여 새로운 이미지를 만들 때, 이미지를 행렬로 표현하고 연산을 하여 나타낼 수 있다.
• 이미지의 합성에 이용되는 행렬의 연산은 ( {{덧셈과 뺄셈}} )이다.

• 이미지의 밝기를 조절할 때 이용되는 행렬의 연산은 ( {{실수배}} )이다.

• 컬러 이미지를 흑백 이미지로 바꿀 때, 흑백 이미지를 나타내는 행렬의 각 성분은 컬러 이미지를 나타내는 세 행렬 $R, G, B$에 대응하는 성분의 ( {{평균}} )으로 구한다.

• 이미지의 평행이동과 대칭이동에 이용되는 행렬의 연산은 ( {{곱셈}} )이다.`
            },
            {
                id: 'sec_3',
                title: '03. 손실함수와 최적화',
                wordBank: '평균변화율\n기울기\n최적화\n학습률\n경사하강법\n(y_1-ax_1)^2+\\cdots+(y_n-ax_n)^2\n\\lim_{x\\to a}f(x)=L\nf\'(a)\n최적 추세선\n수렴',
                content: `입력값 $x_1, \\cdots, x_n$에 대한 측정값이 $y_1, \\cdots, y_n$이고, 추세선 $f(x)=ax$ 에 따른 예측값이 $ax_1, \\cdots, ax_n$ 이라 할 때,
• 오차: $y_1-ax_1, \\cdots, y_n-ax_n$
• 손실함수: $L(a) = \\frac{ ( {{(y_1-ax_1)^2+\\cdots+(y_n-ax_n)^2}} ) }{ n }$

• 다항함수 $y=f(x)$에서 $x$의 값이 $a$가 아니면서 $a$에 한없이 가까워질 때 함숫값 $f(x)$가 일정한 수 $L$에 한없이 가까워지면, 함수 $y=f(x)$는 $L$에 ( {{수렴}} )한다고 하고, 이것을 기호로 ( {{\\lim_{x\\to a}f(x)=L}} )과 같이 나타낸다.

• 다항함수 $y=f(x)$에서 $x$의 값이 $a$에서 $b$까지 변할 때의 ( {{평균변화율}} )은 다음과 같다.
$\\frac{\\Delta y}{\\Delta x} = \\frac{f(b)-f(a)}{b-a}$

• 다항함수 $y=f(x)$에서 $x=a$에서의 미분계수 ( {{f'(a)}} )는 점 $(a, f(a))$에서 곡선 $y=f(x)$의 접선의 ( {{기울기}} )와 같다.

• 손실함수의 값을 최소화하는 추세선의 기울기를 찾는 과정을 손실함수의 ( {{최적화}} )라 하고, 손실함수의 값이 최소가 되도록 하는 추세선을 ( {{최적 추세선}} )이라고 한다.

• 손실함수의 값이 감소하는 방향을 찾고 초깃값을 반복적으로 이동시키면서 최적화하는 방법을 ( {{경사하강법}} )이라고 한다.
• ( {{학습률}} )의 크기를 적절히 조절하면 미분계수의 크기에 관계없이 손실함수의 값이 변하는 정도를 조절할 수 있다.`
            }
        ];

        const SEED_RUBRIC = {
            'sec_1': [{ min: 8, label: 'A', score: 10 }, { min: 5, label: 'B', score: 8 }, { min: 0, label: 'C', score: 6 }],
            'sec_2': [{ min: 7, label: 'A', score: 10 }, { min: 4, label: 'B', score: 8 }, { min: 0, label: 'C', score: 6 }],
            'sec_3': [{ min: 8, label: 'A', score: 10 }, { min: 5, label: 'B', score: 8 }, { min: 0, label: 'C', score: 6 }]
        };

        const evaluateScore = (correctCount, sectionId, rubrics) => {
            const rules = rubrics[sectionId] || [{ min: 0, label: '기본', score: 0 }];
            const sortedRules = [...rules].sort((a, b) => b.min - a.min);
            for (let rule of sortedRules) {
                if (correctCount >= rule.min) return rule;
            }
            return sortedRules[sortedRules.length - 1] || { label: '-', score: 0 };
        };

        const MathText = ({ text }) => {
            const renderParts = [];
            const regex = /\$(.*?)\$/g;
            let lastIndex = 0;
            let match;

            while ((match = regex.exec(text)) !== null) {
                if (match.index > lastIndex) {
                    renderParts.push(<span key={`t_${lastIndex}`}>{text.substring(lastIndex, match.index)}</span>);
                }
                const mathStr = match[1];
                try {
                    const html = katex.renderToString(mathStr, { throwOnError: false, displayMode: false });
                    renderParts.push(<span key={`m_${match.index}`} dangerouslySetInnerHTML={{ __html: html }} />);
                } catch (e) {
                    renderParts.push(<span key={`m_${match.index}`}>${mathStr}$</span>);
                }
                lastIndex = regex.lastIndex;
            }
            if (lastIndex < text.length) {
                renderParts.push(<span key={`t_${lastIndex}`}>{text.substring(lastIndex)}</span>);
            }
            return <>{renderParts.length > 0 ? renderParts : text}</>;
        };

        const AssessmentContent = ({ content, sectionId, answers, onBlankClick }) => {
            const paragraphs = content.split('\n');
            let blankIndex = 0;

            return (
                <div className="space-y-4 text-gray-800 leading-relaxed text-lg pb-4">
                    {paragraphs.map((para, pIdx) => {
                        if (!para.trim()) return <div key={pIdx} className="h-2"></div>;
                        const parts = para.split(/(\{\{.*?\}\})/g);
                        
                        return (
                            <p key={pIdx} className="break-words">
                                {parts.map((part, partIdx) => {
                                    if (part.startsWith('{{') && part.endsWith('}}')) {
                                        const currentBlankId = `${sectionId}_b${blankIndex++}`;
                                        const userAnswer = answers[currentBlankId];
                                        return (
                                            <button key={partIdx} className={`blank-btn ${userAnswer ? 'filled' : ''}`} onClick={() => onBlankClick(currentBlankId)}>
                                                {userAnswer ? <MathText text={userAnswer} /> : <span>&nbsp;</span>}
                                            </button>
                                        );
                                    } else {
                                        return <MathText key={partIdx} text={part} />;
                                    }
                                })}
                            </p>
                        );
                    })}
                </div>
            );
        };

        const StudentAssessment = ({ studentInfo, questions, rubrics, onSubmit }) => {
            const [currentSectionIdx, setCurrentSectionIdx] = React.useState(0);
            const [answers, setAnswers] = React.useState({});
            const [activeBlankId, setActiveBlankId] = React.useState(null);
            
            const currentSection = questions[currentSectionIdx] || questions[0];
            const wordBankOptions = currentSection?.wordBank.split('\n').map(s => s.trim()).filter(s => s) || [];

            const handleOptionSelect = (option) => {
                if (activeBlankId) setAnswers(prev => ({ ...prev, [activeBlankId]: option }));
                setActiveBlankId(null);
            };

            const handleNext = () => {
                if (currentSectionIdx < questions.length - 1) {
                    setCurrentSectionIdx(prev => prev + 1);
                    window.scrollTo(0, 0);
                }
            };

            return (
                <div className="min-h-screen bg-gray-50 pb-24 relative overflow-hidden font-serif tracking-tight">
                    <header className="bg-white border-b-2 border-black px-4 py-4 sticky top-0 z-10 flex justify-between items-center">
                        <div>
                            <h1 className="text-xl font-black text-black">인공지능수학 수행평가</h1>
                            <p className="text-sm font-bold text-gray-600">{studentInfo.id} {studentInfo.name}</p>
                        </div>
                        <div className="text-sm font-bold text-black border-2 border-black px-3 py-1 bg-gray-100">
                            영역 {currentSectionIdx + 1} / {questions.length}
                        </div>
                    </header>

                    <main className="p-4 max-w-2xl mx-auto mt-4">
                        <div className="bg-white border-2 border-black shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] p-5 mb-6">
                            <h2 className="text-lg font-black mb-4 text-black border-b-2 border-black pb-2">
                                {currentSection.title}
                            </h2>
                            <AssessmentContent 
                                content={currentSection.content}
                                sectionId={currentSection.id}
                                answers={answers}
                                onBlankClick={setActiveBlankId}
                            />
                        </div>

                        <div className="flex justify-end gap-3">
                            {currentSectionIdx > 0 && (
                                <button onClick={() => setCurrentSectionIdx(prev => prev - 1)}
                                    className="px-5 py-3 border-2 border-black font-bold bg-white text-black active:bg-gray-100 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                    이전
                                </button>
                            )}
                            {currentSectionIdx < questions.length - 1 ? (
                                <button onClick={handleNext}
                                    className="px-5 py-3 border-2 border-black font-bold bg-black text-white active:bg-gray-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                    다음 영역
                                </button>
                            ) : (
                                <button onClick={() => onSubmit(answers)}
                                    className="px-5 py-3 border-2 border-black font-black bg-black text-white active:bg-gray-800 shadow-[2px_2px_0px_0px_rgba(0,0,0,1)]">
                                    최종 제출
                                </button>
                            )}
                        </div>
                    </main>

                    {/* Word Bank Bottom Sheet */}
                    <div className={`fixed inset-0 bg-black/60 z-40 transition-opacity ${activeBlankId ? 'opacity-100' : 'opacity-0 pointer-events-none'}`} onClick={() => setActiveBlankId(null)}></div>
                    <div className={`fixed bottom-0 left-0 right-0 bg-white border-t-2 border-black shadow-[0_-4px_0px_0px_rgba(0,0,0,1)] z-50 p-6 bottom-sheet ${activeBlankId ? 'open' : 'closed'}`}>
                        <div className="flex justify-between items-center mb-4 border-b-2 border-black pb-2">
                            <h3 className="text-lg font-black text-black">낱말 상자</h3>
                            <button onClick={() => setActiveBlankId(null)} className="text-black font-bold px-3 py-1 border-2 border-black bg-gray-100">닫기</button>
                        </div>
                        <div className="grid grid-cols-2 gap-3 max-h-64 overflow-y-auto pb-4">
                            {wordBankOptions.map((opt, idx) => (
                                <button key={idx} onClick={() => handleOptionSelect(opt)}
                                    className="p-3 bg-white border-2 border-gray-400 text-center font-bold text-black active:border-black active:bg-gray-200">
                                    <MathText text={opt} />
                                </button>
                            ))}
                        </div>
                        <button onClick={() => handleOptionSelect('')} className="w-full mt-2 p-3 bg-gray-100 border-2 border-black text-black font-black active:bg-gray-200">
                            비워두기 (초기화)
                        </button>
                    </div>
                </div>
            );
        };

        const TeacherDashboard = ({ questions, rubrics, onLogout }) => {
            const [tab, setTab] = React.useState('results'); 
            const [submissions, setSubmissions] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [toastMsg, setToastMsg] = React.useState(''); 
            
            const [editQuestions, setEditQuestions] = React.useState(questions);
            const [editRubrics, setEditRubrics] = React.useState(rubrics);
            const [newPassword, setNewPassword] = React.useState('');
            
            const [deleteStudentTarget, setDeleteStudentTarget] = React.useState({show: false, id: null, name: ''});
            const [deleteSectionTarget, setDeleteSectionTarget] = React.useState({show: false, id: null, title: ''});

            React.useEffect(() => {
                const fetchSubs = async () => {
                    const res = await api.post('getSubmissions');
                    if (res.success) {
                        res.data.sort((a, b) => a.studentId.localeCompare(b.studentId));
                        setSubmissions(res.data);
                    }
                    setLoading(false);
                };
                fetchSubs();
            }, []);

            const showToast = (msg) => {
                setToastMsg(msg);
                setTimeout(() => setToastMsg(''), 3000);
            };

            // 낙관적 업데이트 - 설정 저장
            const handleSaveConfig = async (type) => {
                const payload = {};
                if(type === 'questions') payload.questions = editQuestions;
                if(type === 'rubrics') payload.rubrics = editRubrics;
                
                showToast("저장 중...");
                const res = await api.post('saveConfig', payload);
                if(res.success) showToast(type === 'questions' ? "문항이 저장되었습니다." : "루브릭이 저장되었습니다.");
                else showToast("저장에 실패했습니다. URL을 확인하세요.");
            };

            const handleSaveSettings = async () => {
                if(newPassword.length < 4) { showToast("비밀번호는 4자리 이상이어야 합니다."); return; }
                showToast("저장 중...");
                const res = await api.post('saveConfig', { password: newPassword });
                if(res.success) {
                    showToast("비밀번호가 변경되었습니다.");
                    setNewPassword('');
                } else showToast("저장에 실패했습니다.");
            };

            const handleAddSection = () => {
                const newId = 'sec_' + Date.now();
                setEditQuestions([...editQuestions, { id: newId, title: '새로운 영역', wordBank: '', content: '내용을 입력하세요.' }]);
                setEditRubrics({...editRubrics, [newId]: [{ min: 1, label: 'A', score: 10 }]});
                showToast("새 영역이 추가되었습니다.");
            };

            const handleDeleteSectionConfirm = () => {
                const id = deleteSectionTarget.id;
                setEditQuestions(editQuestions.filter(q => q.id !== id));
                const newRubrics = {...editRubrics};
                delete newRubrics[id];
                setEditRubrics(newRubrics);
                setDeleteSectionTarget({show: false, id: null, title: ''});
                showToast("영역이 삭제 대기중입니다. [변경사항 저장]을 눌러야 완전히 반영됩니다.");
            };

            // 낙관적 업데이트 - 학생 데이터 삭제
            const handleDeleteStudentConfirm = async () => {
                const targetId = deleteStudentTarget.id;
                // 1. UI 즉각 반영 (배열에서 제거)
                setSubmissions(prev => prev.filter(s => s.id !== targetId));
                setDeleteStudentTarget({show: false, id: null, name: ''});
                showToast("학생 기록 삭제를 요청했습니다.");
                
                // 2. 백그라운드 처리
                api.post('deleteSubmission', { id: targetId }); 
            };

            const downloadCSV = () => {
                if (submissions.length === 0) return;
                let csvContent = '\uFEFF'; 
                const headers = ['학번', '이름'];
                questions.forEach(q => headers.push(`${q.title.split('.')[0]} 점수`));
                headers.push('총점');
                csvContent += headers.join(',') + '\n';
                
                submissions.forEach(sub => {
                    let row = [sub.studentId, sub.studentName];
                    questions.forEach(q => {
                        const secData = sub.results[q.id];
                        row.push(secData ? secData.scoreInfo.score : 0);
                    });
                    row.push(sub.totalScore);
                    csvContent += row.join(',') + '\n';
                });
                
                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.setAttribute("download", `수행평가결과_${new Date().toISOString().slice(0,10)}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            return (
                <div className="min-h-screen bg-white text-black font-sans flex flex-col relative">
                    {toastMsg && (
                        <div className="fixed top-4 left-1/2 transform -translate-x-1/2 bg-black text-white px-6 py-3 shadow-[4px_4px_0px_0px_rgba(100,100,100,1)] z-50 flex items-center font-bold">
                            <i className="ph ph-check-circle mr-2 text-xl"></i> {toastMsg}
                        </div>
                    )}
                    <header className="border-b-4 border-black px-6 py-4 flex justify-between items-center bg-gray-100">
                        <h1 className="text-xl font-black">교사 관리자 페이지 (낙관적 UI 적용)</h1>
                        <button onClick={onLogout} className="text-sm font-bold border-2 border-black px-3 py-1 bg-white hover:bg-black hover:text-white transition-colors">로그아웃</button>
                    </header>
                    
                    <div className="flex-1 max-w-6xl w-full mx-auto p-6 flex flex-col md:flex-row gap-6">
                        <div className="w-full md:w-64 flex flex-col gap-3">
                            <button onClick={() => setTab('results')} className={`p-3 text-left border-2 border-black font-bold ${tab === 'results' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>학생 제출 결과</button>
                            <button onClick={() => setTab('questions')} className={`p-3 text-left border-2 border-black font-bold ${tab === 'questions' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>문항 및 영역 관리</button>
                            <button onClick={() => setTab('rubrics')} className={`p-3 text-left border-2 border-black font-bold ${tab === 'rubrics' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>채점 기준 (루브릭)</button>
                            <button onClick={() => setTab('settings')} className={`p-3 text-left border-2 border-black font-bold ${tab === 'settings' ? 'bg-black text-white' : 'bg-white hover:bg-gray-100'}`}>설정 (비밀번호 변경)</button>
                        </div>
                        
                        <div className="flex-1 border-4 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] p-6 overflow-hidden flex flex-col bg-white">
                            {tab === 'results' && (
                                <div className="flex flex-col h-full">
                                    <div className="flex justify-between items-center mb-6">
                                        <h2 className="text-xl font-black">제출 기록 ({submissions.length}명)</h2>
                                        <button onClick={downloadCSV} className="border-2 border-black bg-gray-100 px-4 py-2 font-bold hover:bg-gray-200 flex items-center">
                                            <i className="ph ph-download-simple mr-2"></i> 엑셀 다운로드
                                        </button>
                                    </div>
                                    <div className="overflow-x-auto flex-1 border-2 border-black">
                                        {loading ? <div className="p-4 text-center font-bold">데이터 불러오는 중...</div> : 
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-gray-100 text-black text-sm border-b-2 border-black">
                                                    <th className="p-3 border-r-2 border-black">학번</th>
                                                    <th className="p-3 border-r-2 border-black">이름</th>
                                                    {questions.map(q => <th key={q.id} className="p-3 border-r border-gray-400 text-center">{q.title.split('.')[0]} 점수</th>)}
                                                    <th className="p-3 border-r-2 border-black font-black">총점</th>
                                                    <th className="p-3 text-center w-16">관리</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                {submissions.map(sub => (
                                                    <tr key={sub.id} className="border-b border-gray-300 hover:bg-gray-50">
                                                        <td className="p-3 font-bold border-r-2 border-black">{sub.studentId}</td>
                                                        <td className="p-3 border-r-2 border-black">{sub.studentName}</td>
                                                        {questions.map(q => (
                                                            <td key={q.id} className="p-3 text-center border-r border-gray-300">{sub.results[q.id]?.scoreInfo.score || 0}</td>
                                                        ))}
                                                        <td className="p-3 font-black border-r-2 border-black">{sub.totalScore}</td>
                                                        <td className="p-3 text-center">
                                                            <button onClick={() => setDeleteStudentTarget({show:true, id:sub.id, name:sub.studentName})} className="text-gray-500 hover:text-black">
                                                                <i className="ph ph-trash text-lg"></i>
                                                            </button>
                                                        </td>
                                                    </tr>
                                                ))}
                                            </tbody>
                                        </table>}
                                    </div>
                                </div>
                            )}

                            {tab === 'questions' && (
                                <div className="flex flex-col h-full overflow-y-auto pr-2">
                                    <div className="flex justify-between items-center mb-6 border-b-2 border-black pb-4">
                                        <h2 className="text-xl font-black">문항 및 영역 관리</h2>
                                        <div className="flex gap-2">
                                            <button onClick={handleAddSection} className="border-2 border-black px-4 py-2 font-bold bg-white">영역 추가</button>
                                            <button onClick={() => handleSaveConfig('questions')} className="bg-black text-white px-4 py-2 font-bold border-2 border-black">변경사항 저장</button>
                                        </div>
                                    </div>
                                    {editQuestions.map((q, idx) => (
                                        <div key={q.id} className="mb-8 border-2 border-black p-5 relative bg-gray-50">
                                            <button onClick={() => setDeleteSectionTarget({show:true, id:q.id, title:q.title})} className="absolute top-4 right-4 text-black border-2 border-black px-2 py-1 text-sm font-bold bg-white hover:bg-gray-200">삭제</button>
                                            <label className="text-xs font-bold bg-black text-white px-2 py-1 mb-2 inline-block">영역 제목</label>
                                            <input type="text" value={q.title} onChange={e => { const n = [...editQuestions]; n[idx].title = e.target.value; setEditQuestions(n); }}
                                                className="w-full text-lg font-black mb-4 p-2 border-b-2 border-black focus:outline-none bg-transparent" />
                                            
                                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                                <div className="md:col-span-1">
                                                    <label className="block text-sm font-bold text-black mb-2">낱말 상자 (엔터로 구분)</label>
                                                    <textarea value={q.wordBank} onChange={e => { const n = [...editQuestions]; n[idx].wordBank = e.target.value; setEditQuestions(n); }}
                                                        className="w-full h-48 p-3 border-2 border-black text-sm outline-none" />
                                                </div>
                                                <div className="md:col-span-2">
                                                    <label className="block text-sm font-bold text-black mb-2">본문 ( 빈칸: {'{{정답}}'}, 수식: $수식$ )</label>
                                                    <textarea value={q.content} onChange={e => { const n = [...editQuestions]; n[idx].content = e.target.value; setEditQuestions(n); }}
                                                        className="w-full h-48 p-3 border-2 border-black text-sm outline-none" />
                                                </div>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {tab === 'rubrics' && (
                                <div className="flex flex-col h-full overflow-y-auto pr-2">
                                     <div className="flex justify-between items-center mb-6 border-b-2 border-black pb-4">
                                        <h2 className="text-xl font-black">채점 기준 관리</h2>
                                        <button onClick={() => handleSaveConfig('rubrics')} className="bg-black text-white px-4 py-2 font-bold border-2 border-black">변경사항 저장</button>
                                    </div>
                                    {questions.map((q) => (
                                        <div key={q.id} className="mb-6 bg-gray-50 p-5 border-2 border-black">
                                            <h3 className="font-black text-lg mb-4">{q.title}</h3>
                                            <div className="space-y-3">
                                                {editRubrics[q.id]?.map((rule, ruleIdx) => (
                                                    <div key={ruleIdx} className="flex items-center gap-4 bg-white p-3 border-2 border-black">
                                                        <span className="font-bold text-sm">최소</span>
                                                        <input type="number" min="0" max="50" value={rule.min} onChange={e => { const n={...editRubrics}; n[q.id][ruleIdx].min = parseInt(e.target.value)||0; setEditRubrics(n); }} className="w-16 p-1 border-b-2 border-black text-center font-bold outline-none" />
                                                        <span className="font-bold text-sm">개 이상 맞추면</span>
                                                        <div className="ml-auto flex items-center gap-2">
                                                            <input type="text" value={rule.label} onChange={e => { const n={...editRubrics}; n[q.id][ruleIdx].label = e.target.value; setEditRubrics(n); }} className="w-16 p-1 border-b-2 border-black text-center font-bold outline-none" placeholder="등급" />
                                                            <span className="text-sm">등급,</span>
                                                            <input type="number" min="0" value={rule.score} onChange={e => { const n={...editRubrics}; n[q.id][ruleIdx].score = parseInt(e.target.value)||0; setEditRubrics(n); }} className="w-16 p-1 border-b-2 border-black text-center font-black outline-none" />
                                                            <span className="font-bold text-sm">점</span>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {tab === 'settings' && (
                                <div className="p-6">
                                    <h2 className="text-xl font-black mb-6 border-b-2 border-black pb-2">교사 설정</h2>
                                    <div className="max-w-sm">
                                        <label className="block text-sm font-bold mb-2">새로운 교사 로그인 비밀번호</label>
                                        <input type="text" value={newPassword} onChange={e => setNewPassword(e.target.value)} placeholder="새 비밀번호 입력" className="w-full p-3 border-2 border-black mb-4 focus:outline-none" />
                                        <button onClick={handleSaveSettings} className="bg-black text-white px-6 py-3 font-bold w-full border-2 border-black">비밀번호 변경하기</button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>

                    {deleteStudentTarget.show && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
                            <div className="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] p-6 max-w-sm w-full">
                                <h3 className="text-lg font-black mb-2">기록 삭제 경고</h3>
                                <p className="text-sm text-gray-800 font-bold mb-6">[{deleteStudentTarget.name}] 학생의 기록을 지우면 재평가가 가능해집니다.</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteStudentTarget({show:false, id:null, name:''})} className="flex-1 py-2 font-bold border-2 border-black">취소</button>
                                    <button onClick={handleDeleteStudentConfirm} className="flex-1 py-2 font-bold bg-black text-white border-2 border-black">삭제하기</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {deleteSectionTarget.show && (
                        <div className="fixed inset-0 bg-black/50 flex items-center justify-center z-50 px-4">
                            <div className="bg-white border-4 border-black p-6 max-w-sm w-full">
                                <h3 className="text-lg font-black mb-2">영역 삭제</h3>
                                <p className="text-sm font-bold mb-6">[{deleteSectionTarget.title}] 영역을 지우시겠습니까?</p>
                                <div className="flex gap-3">
                                    <button onClick={() => setDeleteSectionTarget({show:false, id:null, title:''})} className="flex-1 py-2 font-bold border-2 border-black">취소</button>
                                    <button onClick={handleDeleteSectionConfirm} className="flex-1 py-2 font-bold bg-black text-white border-2 border-black">삭제하기</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const App = () => {
            const [view, setView] = React.useState('loading');
            const [studentInfo, setStudentInfo] = React.useState({ id: '', name: '' });
            const [questions, setQuestions] = React.useState(SEED_QUESTIONS);
            const [rubrics, setRubrics] = React.useState(SEED_RUBRIC);
            const [resultData, setResultData] = React.useState(null);
            const [systemPwd, setSystemPwd] = React.useState('admin');

            const [teacherPwd, setTeacherPwd] = React.useState('');
            const [showTeacherModal, setShowTeacherModal] = React.useState(false);
            const [teacherLoginError, setTeacherLoginError] = React.useState(false);
            const [studentLoginError, setStudentLoginError] = React.useState('');

            React.useEffect(() => {
                const initApp = async () => {
                    const res = await api.post('getConfig');
                    if (res.success && res.data) {
                        if(res.data.questions && res.data.questions.length > 0) setQuestions(res.data.questions);
                        if(res.data.rubrics && Object.keys(res.data.rubrics).length > 0) setRubrics(res.data.rubrics);
                        if(res.data.password) setSystemPwd(res.data.password);
                    }
                    setView('login');
                };
                initApp();
            }, []);

            const handleStudentLogin = async (e) => {
                e.preventDefault();
                setStudentLoginError('');
                if (!studentInfo.id || studentInfo.id.length !== 4 || !studentInfo.name) {
                    setStudentLoginError("정확한 학번(4자리)과 이름을 입력하세요."); return;
                }
                setView('loading');
                const res = await api.post('getStudent', { studentId: studentInfo.id });
                if (res.success && res.data) {
                    setResultData(res.data); setView('result');
                } else {
                    setView('assessment');
                }
            };

            const calculateResults = (answers) => {
                const results = {};
                let totalScore = 0;
                questions.forEach(q => {
                    let correctCount = 0; let blankIndex = 0;
                    const parts = q.content.split(/(\{\{.*?\}\})/g);
                    parts.forEach(part => {
                        if (part.startsWith('{{') && part.endsWith('}}')) {
                            const correctAns = part.slice(2, -2).trim();
                            const userAns = answers[`${q.id}_b${blankIndex++}`];
                            if (userAns && userAns.trim() === correctAns) correctCount++;
                        }
                    });
                    const scoreInfo = evaluateScore(correctCount, q.id, rubrics);
                    totalScore += scoreInfo.score;
                    results[q.id] = { correct: correctCount, total: blankIndex, scoreInfo };
                });
                return { results, totalScore };
            };

            // 낙관적 업데이트 - 학생 제출
            const handleSubmitAssessment = (answers) => {
                // 1. 계산 및 UI 즉각 전환
                const analysis = calculateResults(answers);
                const submissionData = {
                    studentId: studentInfo.id, studentName: studentInfo.name,
                    answers, results: analysis.results, totalScore: analysis.totalScore, timestamp: new Date().toLocaleString()
                };
                setResultData(submissionData); 
                setView('result'); 

                // 2. 백그라운드에서 구글 시트에 비동기 전송
                api.post('submitAssessment', submissionData);
            };

            const handleTeacherLoginSubmit = () => {
                if (teacherPwd === systemPwd) {
                    setView('teacherDashboard'); setShowTeacherModal(false); setTeacherPwd(''); setTeacherLoginError(false);
                } else { setTeacherLoginError(true); }
            };

            if (view === 'loading') return <div className="min-h-screen flex items-center justify-center bg-gray-100"><div className="animate-spin rounded-full h-12 w-12 border-b-4 border-black"></div></div>;

            if (view === 'login') return (
                <div className="min-h-screen bg-gray-100 flex flex-col justify-center items-center p-4 font-sans tracking-tight">
                    <div className="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] w-full max-w-md">
                        <div className="bg-black p-6 text-center border-b-4 border-black text-white">
                            <h1 className="text-2xl font-black mb-2">인공지능수학 수행평가</h1>
                            <p className="font-bold text-sm text-gray-300">빈칸 채우기 자동 채점 시스템</p>
                        </div>
                        <form onSubmit={handleStudentLogin} className="p-8 space-y-6">
                            {studentLoginError && <div className="bg-gray-100 text-black p-3 border-2 border-black font-bold text-sm text-center">{studentLoginError}</div>}
                            <div>
                                <label className="block text-sm font-black mb-2">학번 (4자리)</label>
                                <input type="number" pattern="\d{4}" required value={studentInfo.id} onChange={e => setStudentInfo({...studentInfo, id: e.target.value})}
                                    placeholder="예: 3501" className="w-full px-4 py-3 border-2 border-black focus:outline-none font-bold text-lg bg-gray-50" />
                            </div>
                            <div>
                                <label className="block text-sm font-black mb-2">이름</label>
                                <input type="text" required value={studentInfo.name} onChange={e => setStudentInfo({...studentInfo, name: e.target.value})}
                                    placeholder="홍길동" className="w-full px-4 py-3 border-2 border-black focus:outline-none font-bold text-lg bg-gray-50" />
                            </div>
                            <button type="submit" className="w-full bg-white border-2 border-black text-black font-black py-4 text-lg hover:bg-gray-100 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] active:shadow-none active:translate-y-1 active:translate-x-1 transition-all">
                                평가 시작하기
                            </button>
                        </form>
                    </div>
                    
                    <button onClick={() => setShowTeacherModal(true)} className="mt-8 text-sm text-gray-500 font-bold hover:text-black">
                        <i className="ph ph-lock-key mr-1"></i> 교사 접속
                    </button>

                    {showTeacherModal && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50 px-4">
                            <div className="bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] w-full max-w-sm p-6">
                                <h2 className="text-xl font-black mb-5">교사 로그인</h2>
                                <div className="mb-6">
                                    <label className="block text-sm font-bold mb-2">비밀번호</label>
                                    <input type="password" value={teacherPwd} onChange={e => setTeacherPwd(e.target.value)} onKeyDown={e => e.key === 'Enter' && handleTeacherLoginSubmit()}
                                        className="w-full px-4 py-3 border-2 border-black focus:outline-none bg-gray-50" />
                                    {teacherLoginError && <p className="text-black font-bold text-sm mt-2">비밀번호가 틀렸습니다.</p>}
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => { setShowTeacherModal(false); setTeacherLoginError(false); setTeacherPwd(''); }} className="flex-1 py-3 border-2 border-black font-bold bg-white">취소</button>
                                    <button onClick={handleTeacherLoginSubmit} className="flex-1 py-3 bg-black text-white font-bold border-2 border-black">접속</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            if (view === 'assessment') return <StudentAssessment studentInfo={studentInfo} questions={questions} rubrics={rubrics} onSubmit={handleSubmitAssessment} />;
            if (view === 'teacherDashboard') return <TeacherDashboard questions={questions} rubrics={rubrics} onLogout={() => setView('login')} />;

            if (view === 'result' && resultData) return (
                <div className="min-h-screen bg-gray-100 p-4 pt-10 font-sans">
                    <div className="max-w-md mx-auto bg-white border-4 border-black shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] overflow-hidden">
                        <div className="bg-black p-6 text-center text-white border-b-4 border-black">
                            <h2 className="text-2xl font-black mb-1">제출 완료</h2>
                            <p className="font-bold">{resultData.studentId} {resultData.studentName} 학생</p>
                        </div>
                        <div className="p-6 text-black">
                            <div className="text-center mb-6 border-b-2 border-dashed border-gray-400 pb-6">
                                <p className="font-bold mb-1">총점</p>
                                <p className="text-5xl font-black">{resultData.totalScore}<span className="text-2xl font-bold ml-1">점</span></p>
                            </div>
                            <div className="space-y-4">
                                {questions.map((q, idx) => {
                                    const res = resultData.results[q.id];
                                    if (!res) return null;
                                    return (
                                        <div key={idx} className="bg-white p-4 border-2 border-black flex justify-between items-center">
                                            <div>
                                                <p className="font-black text-sm">{q.title.split('.')[0]}</p>
                                                <p className="text-xs font-bold mt-1 text-gray-600">맞춘 개수: {res.correct} / {res.total}</p>
                                            </div>
                                            <div className="text-right">
                                                <span className="inline-block bg-black text-white text-xs font-bold px-2 py-1 mb-1">{res.scoreInfo.label} 등급</span>
                                                <p className="font-black">{res.scoreInfo.score}점</p>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                            <button onClick={() => window.location.reload()} className="mt-8 w-full py-4 bg-white border-2 border-black font-black active:bg-gray-100 shadow-[4px_4px_0px_0px_rgba(0,0,0,1)]">
                                처음으로
                            </button>
                        </div>
                    </div>
                </div>
            );

            return null;
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
