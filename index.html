 const LatexText = ({ text }) => {
 if (!text) return null;
 const parts = text.split(/(\$\$.*?\$\$)/g);
 return (
 <span>
 {parts.map((part, index) => {
 if (part.startsWith('$$') && part.endsWith('$$')) {
 const math = part.slice(2, -2);
 try {
 const html = katex.renderToString(math, { throwOnError: false });
 return <span key={index} dangerouslySetInnerHTML={{ __html: html }} />;
 } catch (e) {
 return <span key={index}>{part}</span>;
 }
 }
 return <span key={index}>{part}</span>;
 })}
 </span>
 );
 };

 function QuizView({ currentUser, questions, rubrics, studentsData, setStudentsData, settings, setView, setModal }) {
 const [currentPage, setCurrentPage] = React.useState(0);
 const [studentAnswers, setStudentAnswers] = React.useState({}); 
 const [activeBlank, setActiveBlank] = React.useState(null); 

 React.useEffect(() => {
 const initAnswers = {};
 questions.forEach(q => {
 const blankCount = (q.content.match(/\{\{.*?\}\}/g) || []).length;
 initAnswers[q.id] = Array(blankCount).fill('');
 });
 setStudentAnswers(initAnswers);
 }, [questions]);

 const currentQ = questions[currentPage];
 if (!currentQ) return null;

 const handleWordSelect = (word) => {
 if (!activeBlank) return;
 setStudentAnswers(prev => {
 const newAns = { ...prev };
 newAns[activeBlank.qId][activeBlank.index] = word;
 return newAns;
 });
 setActiveBlank(null);
 };

 const handleSubmit = () => {
 setModal({
 show: true,
 isAlert: false,
 message: "?뺣쭚 ?쒖텧?섏떆寃좎뒿?덇퉴?\n?쒖텧 ?꾩뿉???섏젙?????놁뒿?덈떎.",
 onConfirm: () => {
 let totalScore = 0;
 const results = {};
 questions.forEach(q => {
 const correctAnswers = (q.content.match(/\{\{(.*?)\}\}/g) || []).map(s => s.replace(/[{}]/g, '').trim());
 const userAnswers = studentAnswers[q.id] || [];
 let correctCount = 0;
 correctAnswers.forEach((ans, idx) => {
 if (userAnswers[idx] === ans) correctCount++;
 });
 const qRubrics = rubrics[q.id] || [];
 let scoreInfo = { grade: 'F', score: 0 };
 for (let r of qRubrics) {
 if (correctCount >= r.min && correctCount <= r.max) {
 scoreInfo = { grade: r.grade, score: r.score };
 break;
 }
 }
 results[q.id] = { correctCount, scoreInfo };
 totalScore += scoreInfo.score;
 });

 const finalData = {
 id: currentUser.id,
 name: currentUser.name,
 results,
 totalScore,
 timestamp: new Date().toLocaleString(),
 scores: questions.map(q => results[q.id].scoreInfo.score)
 };

 const newData = [...studentsData, finalData];
 setStudentsData(newData);
 localStorage.setItem('aiMath_students', JSON.stringify(newData));
 
 if (settings.gasUrl) {
 try {
 fetch(settings.gasUrl, {
 method: 'POST',
 mode: 'no-cors',
 headers: { 'Content-Type': 'text/plain' },
 body: JSON.stringify({ action: "submit", data: finalData })
 });
 } catch(e) { console.error("Sheet Error:", e); }
 }
 setView('result');
 }
 });
 };

 const renderContentWithBlanks = (q) => {
        if (q.type === 'essay') {
          return (
            <React.Fragment>
              <div className="mb-4 whitespace-pre-wrap">{q.content}</div>
              <textarea 
                value={(studentAnswers[q.id] && studentAnswers[q.id][0]) || ''}
                onChange={(e) => {
                  setStudentAnswers(prev => {
                    const newAns = { ...prev };
                    if (!newAns[q.id]) newAns[q.id] = [];
                    newAns[q.id][0] = e.target.value;
                    return newAns;
                  });
                }}
                className="w-full p-4 border-4 border-black font-bold outline-none h-40 resize-none rounded focus:bg-blue-50"
                placeholder="답안을 서술하세요."
              />
            </React.Fragment>
          );
        }

        const parts = (q.content || '').split(/(\{\{.*?\}\})/g);
        let blankIdx = 0;
        return parts.map((part, i) => {
          if (part.startsWith('{{') && part.endsWith('}}')) {
            const currentIdx = blankIdx++;
            const ans = studentAnswers[q.id] && studentAnswers[q.id][currentIdx];
            
            if (q.type === 'value') {
              return (
                <input 
                  key={i} type="text" value={ans || ''}
                  onChange={(e) => {
                    setStudentAnswers(prev => {
                      const newAns = { ...prev };
                      if (!newAns[q.id]) newAns[q.id] = [];
                      newAns[q.id][currentIdx] = e.target.value;
                      return newAns;
                    });
                  }}
                  className="border-b-2 border-black bg-transparent w-24 text-center font-bold outline-none focus:bg-blue-50"
                  placeholder="입력"
                />
              );
            } else {
              const isActive = activeBlank && activeBlank.qId === q.id && activeBlank.index === currentIdx;
              return (
                <span 
                  key={i} 
                  onClick={() => setActiveBlank({ qId: q.id, index: currentIdx })}
                  className={`inline-block min-w-[3rem] text-center border-b-4 ${isActive ? 'border-red-500 text-red-500' : 'border-black'} font-black cursor-pointer mx-1 pb-1`}
                >
                  {ans || '?'}
                </span>
              );
            }
          }
          return <span key={i}>{part}</span>;
        });
      };

 return (
 <div className="flex flex-col h-[80vh]">
 <div className="flex justify-between items-center mb-4">
 <h2 className="text-xl font-black">{currentQ.title}</h2>
 <span className="font-bold border-2 border-black px-3 py-1 bg-white">{currentPage + 1} / {questions.length}</span>
 </div>
 <div className="worksheet-box p-4 sm:p-6 flex-1 overflow-y-auto leading-loose text-base sm:text-lg whitespace-pre-wrap">

 {currentPage < questions.length - 1 ? (
 <button onClick={() => {setCurrentPage(p => p + 1); setActiveBlank(null);}} className="flex-1 bg-black text-white border-2 border-black py-4 font-black btn-retro text-sm sm:text-base">?ㅼ쓬 ?곸뿭 ??/button>
 ) : (
 <button onClick={handleSubmit} className="flex-1 bg-black text-white border-2 border-black py-4 font-black btn-retro text-sm sm:text-base">理쒖쥌 ?쒖텧?섍린</button>

 </div>
 </div>

 }
