<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI 활용 수학 평가</title>
  
  <script src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <style>
    body { font-family: 'Pretendard', sans-serif; background-color: #f3f4f6; }
    .blank-input {
      display: inline-block; min-width: 60px; min-height: 30px;
      border-bottom: 2px solid #000; margin: 0 4px; padding: 0 8px;
      text-align: center; cursor: pointer; transition: all 0.2s;
    }
    .blank-active {
      background-color: #e5e7eb; border-bottom: 3px solid #3b82f6; box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
    }
    .latex-container { display: inline-block; vertical-align: middle; }
    /* 인쇄용 스타일 수정: column 제거하고 Grid 사용 */
    @media print {
      body { background-color: #fff; margin: 0; padding: 0; }
      .no-print { display: none !important; }
      .print-area { display: block !important; width: 100%; }
      .worksheet-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        grid-gap: 20px;
        width: 100%;
        page-break-inside: avoid;
      }
      .question-box { page-break-inside: avoid; margin-bottom: 20px; }
      #pdf-content { padding: 0 !important; width: 210mm; min-height: 297mm; margin: 0 auto; }
    }
    @page { margin: 10mm; size: A4; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const LatexText = ({ text }) => {
      if (!text) return null;
      const parts = text.split(/(\$\$.*?\$\$)/g);
      return (
        <React.Fragment>
          {parts.map((part, index) => {
            if (part.startsWith('$$') && part.endsWith('$$')) {
              const math = part.slice(2, -2);
              try {
                const html = katex.renderToString(math, { throwOnError: false });
                return <span key={index} dangerouslySetInnerHTML={{ __html: html }} />;
              } catch (e) {
                return <span key={index}>{part}</span>;
              }
            }
            return <span key={index}>{part}</span>;
          })}
        </React.Fragment>
      );
    };

    const DEFAULT_GAS_URL = "";

    const App = () => {
      const [view, setView] = React.useState('login');
      const [currentUser, setCurrentUser] = React.useState({ id: '', name: '' });
      const [studentsBySession, setStudentsBySession] = React.useState({ "1차": [] });
      const [isTeacher, setIsTeacher] = React.useState(false);
      const [isLoadingData, setIsLoadingData] = React.useState(false);
      const [isSyncingConfig, setIsSyncingConfig] = React.useState(true);
      
      const defaultQuestions = [
        { id: 'q1', type: 'count', title: '01. 텍스트 자료의 정제 및 표현', content: '관찰이나 측정 등을 통해 수집된 자료 중 텍스트 자료에서 단어의 {{빈도수}}를 구하고, 이를 {{시각화}}하여 자료의 특징을 파악할 수 있다.', options: ['빈도수', '시각화', '오차', '수치화'] }
      ];
      const defaultRubrics = {
        'q1': [
          { min: 2, max: 2, grade: 'A', score: 10 },
          { min: 1, max: 1, grade: 'B', score: 7 },
          { min: 0, max: 0, grade: 'C', score: 4 }
        ]
      };

      const [configBySession, setConfigBySession] = React.useState({
        "1차": { questions: defaultQuestions, rubrics: defaultRubrics }
      });
      const [settings, setSettings] = React.useState({
        title: '인공지능 수학 수행평가',
        gasUrl: DEFAULT_GAS_URL,
        password: 'admin',
        sessions: ["1차"]
      });
      const [activeSession, setActiveSession] = React.useState("1차");
      const [modalState, setModalState] = React.useState({ show: false, type: 'alert', title: '', message: '', inputPlaceholder: '', onConfirm: null, onCancel: null, defaultValue: '' });
      const [modalInput, setModalInput] = React.useState('');

      const showModal = (type, title, message, inputPlaceholder = '', defaultValue = '') => {
        return new Promise((resolve) => {
          setModalInput(defaultValue);
          setModalState({
            show: true,
            type, title, message, inputPlaceholder, defaultValue,
            onConfirm: (val) => { setModalState(prev => ({...prev, show: false})); resolve(val); },
            onCancel: () => { setModalState(prev => ({...prev, show: false})); resolve(null); }
          });
        });
      };

      React.useEffect(() => {
        let savedConfigBySession = { "1차": { questions: defaultQuestions, rubrics: defaultRubrics } };
        let savedStudentsBySession = { "1차": [] };
        
        // 마이그레이션 로직
        const oldQuestions = localStorage.getItem('aiMath_questions');
        const oldRubrics = localStorage.getItem('aiMath_rubrics');
        if (oldQuestions) {
          try {
            const pq = JSON.parse(oldQuestions);
            const pr = JSON.parse(oldRubrics || "{}");
            if (Array.isArray(pq)) {
              pq.forEach(q => { if(!q.type) q.type = 'count'; });
              savedConfigBySession["1차"] = { questions: pq, rubrics: pr };
            }
          } catch(e) {}
        }
        
        const oldConfig = localStorage.getItem('aiMath_configBySession');
        if (oldConfig) savedConfigBySession = JSON.parse(oldConfig);
        
        const savedStudents = localStorage.getItem('aiMath_students');
        if (savedStudents) {
          try {
            const ps = JSON.parse(savedStudents);
            if (Array.isArray(ps)) {
              savedStudentsBySession["1차"] = ps;
            } else {
              savedStudentsBySession = ps;
            }
          } catch(e) {}
        }
        
        const oldSettings = localStorage.getItem('aiMath_settings');
        let currentSettings = { ...settings };
        if (oldSettings) {
          currentSettings = { ...currentSettings, ...JSON.parse(oldSettings) };
        }
        if (!currentSettings.sessions || currentSettings.sessions.length === 0) currentSettings.sessions = ["1차"];
        
        setSettings(currentSettings);
        setConfigBySession(savedConfigBySession);
        setStudentsBySession(savedStudentsBySession);
        setActiveSession(currentSettings.sessions[0]);
        
        if (currentSettings.gasUrl) {
          fetch(currentSettings.gasUrl + '?action=getConfig')
            .then(res => res.json())
            .then(json => {
              if (json && json.status === 'success' && json.data) {
                const fetchedSessions = json.data.sessions || ["1차"];
                const fetchedConfig = json.data.configBySession || { "1차": { questions: defaultQuestions, rubrics: defaultRubrics } };
                setSettings(s => ({...s, sessions: fetchedSessions, password: json.data.password || s.password, title: json.data.title || s.title}));
                setConfigBySession(fetchedConfig);
                setActiveSession(fetchedSessions[0]);
                localStorage.setItem('aiMath_settings', JSON.stringify({...currentSettings, sessions: fetchedSessions, password: json.data.password || currentSettings.password, title: json.data.title || currentSettings.title}));
                localStorage.setItem('aiMath_configBySession', JSON.stringify(fetchedConfig));
              }
            })
            .catch(e => console.error(e))
            .finally(() => setIsSyncingConfig(false));
        } else {
          setIsSyncingConfig(false);
        }
      }, []);

      React.useEffect(() => {
        if (isTeacher && view === 'admin' && settings.gasUrl) {
          setIsLoadingData(true);
          let fetchUrl = settings.gasUrl.trim();
          if (!fetchUrl.startsWith('http')) fetchUrl = 'https://' + fetchUrl;
          fetch(fetchUrl)
            .then(res => res.json())
            .then(json => {
              if (json.status === 'success') {
                let result = json.data;
                if (Array.isArray(result)) {
                  result = { "1차": result };
                }
                setStudentsBySession(result);
                localStorage.setItem('aiMath_students', JSON.stringify(result));
              }
            })
            .catch(e => console.error(e))
            .finally(() => setIsLoadingData(false));
        }
      }, [isTeacher, view, settings.gasUrl]);

      React.useEffect(() => {
        document.title = settings.title;
      }, [settings.title]);

      const handleSyncConfig = () => {
        if (!settings.gasUrl) {
          showModal('alert', '오류', '구글 앱스 스크립트 웹 앱 URL을 먼저 저장해주세요.');
          return;
        }
        const configData = {
          title: settings.title,
          password: settings.password,
          sessions: settings.sessions,
          configBySession: configBySession
        };
        let fetchUrl = settings.gasUrl.trim();
        if (!fetchUrl.startsWith('http')) fetchUrl = 'https://' + fetchUrl;
        fetch(fetchUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain' },
          body: JSON.stringify({ action: "saveConfig", data: configData })
        }).then(() => {
          showModal('alert', '성공', '구글 시트에 모든 설정과 문항/루브릭 배포가 완료되었습니다.');
        }).catch(err => {
          showModal('alert', '오류', '저장 중 오류가 발생했습니다.');
        });
      };

      if (isSyncingConfig) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-gray-100">
            <div className="text-2xl font-bold p-8 bg-white rounded-xl shadow-lg border-2 border-black">
              구글 시트에서 설정을 불러오는 중입니다...
            </div>
          </div>
        );
      }

      return (
        <React.Fragment>
          {view === 'login' && <LoginView setActiveSession={setActiveSession} activeSession={activeSession} settings={settings} setView={setView} setCurrentUser={setCurrentUser} setIsTeacher={setIsTeacher} showModal={showModal} />}
          {view === 'quiz' && <QuizView activeSession={activeSession} settings={settings} configBySession={configBySession} currentUser={currentUser} setView={setView} setStudentsBySession={setStudentsBySession} showModal={showModal} />}
          {view === 'result' && <ResultView activeSession={activeSession} currentUser={currentUser} studentsBySession={studentsBySession} setView={setView} />}
          {view === 'admin' && (
            <AdminDashboard 
              activeSession={activeSession} setActiveSession={setActiveSession}
              settings={settings} setSettings={setSettings}
              configBySession={configBySession} setConfigBySession={setConfigBySession}
              studentsBySession={studentsBySession} setStudentsBySession={setStudentsBySession}
              setView={setView} setIsTeacher={setIsTeacher}
              handleSyncConfig={handleSyncConfig} isLoadingData={isLoadingData}
              showModal={showModal}
            />
          )}

          {modalState.show && (
            <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
              <div className="bg-white p-6 rounded-xl border-4 border-black w-full max-w-sm shadow-[8px_8px_0_0_rgba(0,0,0,1)]">
                <h3 className="font-black text-2xl mb-4 bg-yellow-300 inline-block px-3 py-1 shadow-[2px_2px_0_0_rgba(0,0,0,1)] -rotate-1">{modalState.title}</h3>
                <p className="mb-6 font-bold text-lg leading-snug">{modalState.message}</p>
                {modalState.type === 'input' && (
                  <input 
                    type="text" value={modalInput} onChange={e => setModalInput(e.target.value)}
                    placeholder={modalState.inputPlaceholder}
                    className="w-full p-3 border-4 border-black mb-6 font-bold outline-none focus:bg-blue-50"
                  />
                )}
                <div className="flex gap-3">
                  {modalState.type !== 'alert' && (
                    <button onClick={modalState.onCancel} className="flex-1 p-3 border-4 border-black font-black bg-white hover:bg-gray-100 shadow-[4px_4px_0_0_rgba(0,0,0,1)] hover:translate-y-1 hover:shadow-none transition-all">취소</button>
                  )}
                  <button onClick={() => modalState.onConfirm(modalInput)} className="flex-1 p-3 border-4 border-black bg-blue-500 text-white font-black hover:bg-blue-600 shadow-[4px_4px_0_0_rgba(0,0,0,1)] hover:translate-y-1 hover:shadow-none transition-all">확인</button>
                </div>
              </div>
            </div>
          )}
        </React.Fragment>
      );
    };

    const LoginView = ({ setActiveSession, activeSession, settings, setView, setCurrentUser, setIsTeacher, showModal }) => {
      const [id, setId] = React.useState('');
      const [name, setName] = React.useState('');
      const handleLogin = (e) => {
        e.preventDefault();
        if (id && name) {
          setCurrentUser({ id, name });
          setView('quiz');
        }
      };
      const handleTeacherLogin = () => {
        showModal('input', '교사 접속', '교사 비밀번호를 입력하세요:').then(pwd => {
          if (pwd === settings.password) {
            setIsTeacher(true);
            setView('admin');
          } else if (pwd !== null) {
            showModal('alert', '오류', '비밀번호가 일치하지 않습니다.');
          }
        });
      };
      
      return (
        <div className="min-h-screen flex items-center justify-center px-4 relative">
          <button onClick={handleTeacherLogin} className="absolute top-4 right-4 bg-gray-800 text-white px-4 py-2 rounded font-bold shadow hover:bg-gray-700">교사 접속</button>
          <form onSubmit={handleLogin} className="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border-4 border-black mt-12">
            <h1 className="text-3xl font-black mb-8 text-center bg-yellow-300 inline-block px-4 py-2 rotate-[-2deg] shadow-[4px_4px_0_0_rgba(0,0,0,1)]">{settings.title}</h1>
            
            <div className="mb-4">
              <label className="block font-bold mb-2">평가 회차</label>
              <select value={activeSession} onChange={e => setActiveSession(e.target.value)} className="w-full p-4 border-2 border-black font-bold text-xl outline-none focus:bg-blue-50">
                {settings.sessions.map(s => <option key={s} value={s}>{s}</option>)}
              </select>
            </div>

            <input type="text" placeholder="학번 (예: 10101)" value={id} onChange={e => setId(e.target.value)} className="w-full mb-4 p-4 border-2 border-black font-bold text-xl outline-none focus:bg-blue-50" required />
            <input type="text" placeholder="이름 (예: 홍길동)" value={name} onChange={e => setName(e.target.value)} className="w-full mb-8 p-4 border-2 border-black font-bold text-xl outline-none focus:bg-blue-50" required />
            
            <button type="submit" className="w-full bg-blue-500 text-white font-black text-2xl py-4 border-4 border-black shadow-[4px_4px_0_0_rgba(0,0,0,1)] hover:translate-y-1 hover:shadow-none transition-all">시작하기</button>
          </form>
        </div>
      );
    };

    const QuizView = ({ activeSession, settings, configBySession, currentUser, setView, setStudentsBySession, showModal }) => {
      const questions = (configBySession[activeSession] && configBySession[activeSession].questions) || [];
      const rubrics = (configBySession[activeSession] && configBySession[activeSession].rubrics) || {};
      const [currentQIndex, setCurrentQIndex] = React.useState(0);
      const [studentAnswers, setStudentAnswers] = React.useState({});
      const [activeBlank, setActiveBlank] = React.useState(null);
      const [isSubmitting, setIsSubmitting] = React.useState(false);

      const currentQ = questions[currentQIndex];

      if (!currentQ) return <div className="p-8 font-bold">문항이 없습니다.</div>;

      const renderContentWithBlanks = (q) => {
        const parts = (q.content || '').split(/(\{\{.*?\}\})/g);
        let blankIdx = 0;
        return parts.map((part, i) => {
          if (part.startsWith('{{') && part.endsWith('}}')) {
            const currentIdx = blankIdx++;
            const ans = studentAnswers[q.id] && studentAnswers[q.id][currentIdx];
            
            if (q.type === 'value') {
              return (
                <input 
                  key={i} type="text" value={ans || ''}
                  onChange={(e) => {
                    setStudentAnswers(prev => {
                      const newAns = { ...prev };
                      if (!newAns[q.id]) newAns[q.id] = [];
                      newAns[q.id][currentIdx] = e.target.value;
                      return newAns;
                    });
                  }}
                  className="border-b-2 border-black bg-transparent w-24 text-center font-bold outline-none focus:bg-blue-50"
                  placeholder="입력"
                />
              );
            } else {
              const isActive = activeBlank && activeBlank.qId === q.id && activeBlank.index === currentIdx;
              return (
                <span key={i} onClick={() => setActiveBlank({ qId: q.id, index: currentIdx })} className={`blank-input ${isActive ? 'blank-active' : ''}`}>
                  {ans ? <LatexText text={ans} /> : <span className="text-gray-300">터치</span>}
                </span>
              );
            }
          }
          return <LatexText key={i} text={part} />;
        });
      };

      const handleSelectWord = (word) => {
        if (!activeBlank) return;
        setStudentAnswers(prev => {
          const newAns = { ...prev };
          if (!newAns[activeBlank.qId]) newAns[activeBlank.qId] = [];
          newAns[activeBlank.qId][activeBlank.index] = word;
          return newAns;
        });
        setActiveBlank(null);
      };

      const handleSubmit = () => {
        showModal('confirm', '제출 확인', '정말 제출하시겠습니까?').then(confirmed => {
          if (!confirmed) return;
          setIsSubmitting(true);
          let totalScore = 0;
          const results = {};

          questions.forEach(q => {
            const correctAnswers = ((q.content || '').match(/\{\{(.*?)\}\}/g) || []).map(s => s.replace(/[{}]/g, '').trim());
            const userAnswers = studentAnswers[q.id] || [];
            const qRubrics = rubrics[q.id] || [];
            let scoreInfo = { grade: 'F', score: 0 };
            let correctCount = 0;

            if (q.type === 'value') {
               const val = (userAnswers[0] || '').trim();
               let matched = false;
               for (let r of qRubrics) {
                 if (r.matchValue && r.matchValue.toString().trim() === val) {
                   scoreInfo = { grade: r.grade, score: r.score };
                   matched = true;
                   correctCount = 1;
                   break;
                 }
               }
               if (!matched) {
                 for (let r of qRubrics) {
                   if (r.matchValue === '기타' || r.matchValue === '*') {
                     scoreInfo = { grade: r.grade, score: r.score };
                     break;
                   }
                 }
               }
            } else {
              correctAnswers.forEach((ans, idx) => {
                if (userAnswers[idx] === ans) correctCount++;
              });
              for (let r of qRubrics) {
                if (correctCount >= r.min && correctCount <= r.max) {
                  scoreInfo = { grade: r.grade, score: r.score };
                  break;
                }
              }
            }
            
            results[q.id] = { correctCount, scoreInfo, type: q.type, userAnswers, correctAnswers };
            totalScore += scoreInfo.score;
          });

          const finalData = {
            id: currentUser.id,
            name: currentUser.name,
            results,
            totalScore,
            timestamp: new Date().toLocaleString(),
            scores: questions.map(q => results[q.id].scoreInfo.score)
          };

          if (settings.gasUrl) {
            let fetchUrl = settings.gasUrl.trim();
            if (!fetchUrl.startsWith('http')) fetchUrl = 'https://' + fetchUrl;
            fetch(fetchUrl, {
              method: 'POST',
              mode: 'no-cors',
              headers: { 'Content-Type': 'text/plain' },
              body: JSON.stringify({ action: "submit", data: { session: activeSession, ...finalData } })
            }).then(() => {
              setStudentsBySession(prev => {
                const next = {...prev};
                if(!next[activeSession]) next[activeSession] = [];
                next[activeSession].push(finalData);
                return next;
              });
              setIsSubmitting(false);
              showModal('alert', '제출 완료', '제출이 완료되었습니다!').then(() => setView('result'));
            }).catch(e => {
              console.error(e);
              setIsSubmitting(false);
              showModal('alert', '제출 실패', '제출 중 오류가 발생했습니다. 네트워크 연결이나 앱스 스크립트 주소를 확인해주세요.');
            });
          } else {
            setStudentsBySession(prev => {
              const next = {...prev};
              if(!next[activeSession]) next[activeSession] = [];
              next[activeSession].push(finalData);
              localStorage.setItem('aiMath_students', JSON.stringify(next));
              return next;
            });
            setIsSubmitting(false);
            setView('result');
          }
        });
      };

      return (
        <div className="min-h-screen bg-gray-100 p-4 flex flex-col items-center">
          <div className="w-full max-w-4xl bg-white rounded-xl border-4 border-black flex flex-col h-[85vh] shadow-[8px_8px_0_0_rgba(0,0,0,1)]">
            <div className="p-4 sm:p-6 flex-shrink-0 flex justify-between items-center border-b-4 border-black bg-blue-50 rounded-t-lg">
              <span className="bg-black text-white px-4 py-1 rounded-full font-bold text-sm sm:text-base shadow-[2px_2px_0_0_rgba(0,0,0,0.5)]">{activeSession} - {currentQIndex + 1}/{questions.length}</span>
              <span className="font-black text-gray-700 bg-white px-3 py-1 border-2 border-black rounded-lg text-sm sm:text-base">[{currentUser.id}] {currentUser.name}</span>
            </div>
            
            <div className="p-4 sm:p-6 flex-shrink-0">
              <h2 className="text-xl sm:text-2xl font-black break-keep">{currentQ.title}</h2>
            </div>

            <div className="flex-1 overflow-y-auto px-4 sm:px-6 pb-6 text-lg sm:text-xl md:text-2xl leading-loose font-medium whitespace-pre-wrap break-keep">
              {renderContentWithBlanks(currentQ)}
            </div>
            
            {activeBlank && activeBlank.qId === currentQ.id && currentQ.type !== 'value' && (
              <div className="flex-shrink-0 bg-yellow-300 p-4 border-t-4 border-black shadow-[0_-4px_0_0_rgba(0,0,0,0.1)]">
                <p className="font-black mb-3">알맞은 단어를 선택하세요:</p>
                <div className="flex flex-wrap gap-3">
                  {(currentQ.options || []).map((opt, i) => (
                    <button key={i} onClick={() => handleSelectWord(opt)} className="bg-white px-4 py-2 border-2 border-black font-black rounded hover:bg-black hover:text-white transition-all shadow-[2px_2px_0_0_rgba(0,0,0,1)] hover:shadow-none hover:translate-y-0.5 hover:translate-x-0.5">
                      <LatexText text={opt} />
                    </button>
                  ))}
                </div>
              </div>
            )}

            <div className="flex-shrink-0 flex justify-between p-4 sm:p-6 border-t-4 border-black bg-gray-50 rounded-b-lg">
              <button onClick={() => { setCurrentQIndex(Math.max(0, currentQIndex - 1)); setActiveBlank(null); }} disabled={currentQIndex === 0} className="px-6 py-3 font-black border-2 border-black rounded-lg bg-white shadow-[4px_4px_0_0_rgba(0,0,0,1)] disabled:opacity-30 disabled:shadow-none transition-all">이전 영역</button>
              {currentQIndex === questions.length - 1 ? (
                <button onClick={handleSubmit} disabled={isSubmitting} className="bg-blue-500 text-white px-8 py-3 font-black text-xl border-2 border-black rounded-lg shadow-[4px_4px_0_0_rgba(0,0,0,1)] hover:translate-y-1 hover:shadow-none transition-all">{isSubmitting ? '제출중...' : '최종 제출하기'}</button>
              ) : (
                <button onClick={() => { setCurrentQIndex(currentQIndex + 1); setActiveBlank(null); }} className="bg-black text-white px-8 py-3 font-black rounded-lg shadow-[4px_4px_0_0_rgba(0,0,0,0.5)] hover:translate-y-1 hover:shadow-none transition-all">다음 영역</button>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ResultView = ({ activeSession, currentUser, studentsBySession, setView }) => {
      const myData = (studentsBySession[activeSession] || []).slice().reverse().find(s => s.id === currentUser.id && s.name === currentUser.name);
      if (!myData) return <div className="p-8">결과를 찾을 수 없습니다.</div>;
      
      return (
        <div className="min-h-screen flex items-center justify-center bg-gray-100 p-4">
          <div className="bg-white p-8 rounded-2xl shadow-xl border-4 border-black text-center w-full max-w-md">
            <h1 className="text-3xl font-black mb-2">평가 완료</h1>
            <p className="text-gray-500 font-bold mb-8">{activeSession} - {currentUser.name} 학생</p>
            <div className="bg-yellow-300 rounded-xl p-6 border-2 border-black shadow-[4px_4px_0_0_rgba(0,0,0,1)] mb-8">
              <p className="text-xl font-bold mb-2">총점</p>
              <p className="text-6xl font-black">{myData.totalScore}점</p>
            </div>
            <div className="space-y-4 mb-8">
              {Object.entries(myData.results).map(([qId, res], i) => (
                <div key={qId} className="flex justify-between items-center border-b-2 border-dashed pb-2">
                  <span className="font-bold">문항 {i+1}</span>
                  <span className="font-bold px-3 py-1 bg-gray-200 rounded">{res.scoreInfo.grade}등급 ({res.scoreInfo.score}점)</span>
                </div>
              ))}
            </div>
            <button onClick={() => setView('login')} className="w-full bg-black text-white font-bold py-3 rounded-lg border-2 border-black">처음으로 돌아가기</button>
          </div>
        </div>
      );
    };

    const AdminDashboard = ({ activeSession, setActiveSession, settings, setSettings, configBySession, setConfigBySession, studentsBySession, setStudentsBySession, setView, setIsTeacher, handleSyncConfig, isLoadingData, showModal }) => {
      const [tab, setTab] = React.useState('settings');
      const questions = (configBySession[activeSession] && configBySession[activeSession].questions) || [];
      const rubrics = (configBySession[activeSession] && configBySession[activeSession].rubrics) || {};
      const students = studentsBySession[activeSession] || [];

      const handleDeleteStudent = (studentId, e) => {
        e.stopPropagation();
        showModal('confirm', '학생 기록 삭제', '정말 이 학생의 제출 기록을 삭제하시겠습니까?').then(confirmed => {
          if (confirmed) {
            if (settings.gasUrl) {
              let fetchUrl = settings.gasUrl.trim();
              if (!fetchUrl.startsWith('http')) fetchUrl = 'https://' + fetchUrl;
              fetch(fetchUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain' },
                body: JSON.stringify({ action: "delete", data: { session: activeSession, studentId: studentId } })
              }).then(() => {
                setStudentsBySession(prev => {
                  const next = {...prev};
                  if (next[activeSession]) {
                    next[activeSession] = next[activeSession].filter(s => s.id !== studentId);
                  }
                  return next;
                });
                showModal('alert', '삭제 완료', '기록이 삭제되었습니다.');
              }).catch(e => {
                console.error(e);
                showModal('alert', '삭제 실패', '네트워크 연결이나 웹 앱 주소를 확인해주세요.');
              });
            } else {
              setStudentsBySession(prev => {
                const next = {...prev};
                if (next[activeSession]) {
                  next[activeSession] = next[activeSession].filter(s => s.id !== studentId);
                  localStorage.setItem('aiMath_students', JSON.stringify(next));
                }
                return next;
              });
              showModal('alert', '삭제 완료', '기록이 삭제되었습니다.');
            }
          }
        });
      };

      const handleAddSession = () => {
         showModal('input', '회차 추가', '새로운 평가 회차 이름을 입력하세요 (예: 3차)', '회차 이름').then(name => {
           if (name && !settings.sessions.includes(name)) {
             setSettings(s => ({...s, sessions: [...s.sessions, name]}));
             setConfigBySession(prev => ({...prev, [name]: {questions: [], rubrics: {}}}));
             setActiveSession(name);
           }
         });
      };
      const handleDelSession = () => {
         if (settings.sessions.length <= 1) {
           showModal('alert', '삭제 불가', '최소 1개의 회차는 있어야 합니다.');
           return;
         }
         showModal('confirm', '회차 삭제', `'${activeSession}' 회차를 삭제하시겠습니까? (학생 데이터는 구글 시트에 남아있습니다)`).then(confirmed => {
           if (confirmed) {
             setSettings(s => {
               const newS = s.sessions.filter(x => x !== activeSession);
               setActiveSession(newS[0]);
               return {...s, sessions: newS};
             });
           }
         });
      };

      const handleAddQuestion = (type) => {
        const newId = 'q' + Date.now();
        const newQ = { id: newId, type: type, title: '새로운 영역', content: '내용을 입력하세요. 정답: {{빈칸}}', options: type === 'count' ? ['빈칸'] : [] };
        const newConfig = { ...configBySession };
        if(!newConfig[activeSession]) newConfig[activeSession] = {questions:[], rubrics:{}};
        newConfig[activeSession].questions.push(newQ);
        
        if (type === 'count') {
          newConfig[activeSession].rubrics[newId] = [{ min: 0, max: 1, grade: 'A', score: 10 }];
        } else {
          newConfig[activeSession].rubrics[newId] = [
            { matchValue: '15', grade: 'A', score: 10 },
            { matchValue: '기타', grade: 'C', score: 0 }
          ];
        }
        setConfigBySession(newConfig);
      };

      const handleDeleteQuestion = (id) => {
        const newConfig = { ...configBySession };
        newConfig[activeSession].questions = newConfig[activeSession].questions.filter(q => q.id !== id);
        delete newConfig[activeSession].rubrics[id];
        setConfigBySession(newConfig);
      };

      return (
        <div className="min-h-screen bg-gray-100 no-print">
          <nav className="bg-black text-white p-4 flex justify-between items-center">
            <div className="flex items-center gap-4">
              <h1 className="font-bold text-xl">관리자 대시보드</h1>
              <select value={activeSession} onChange={e => setActiveSession(e.target.value)} className="text-black font-bold px-2 py-1 outline-none">
                {settings.sessions.map(s => <option key={s} value={s}>{s} 관리</option>)}
              </select>
            </div>
            <div>
              <button onClick={handleSyncConfig} className="bg-blue-500 hover:bg-blue-400 text-white font-bold px-4 py-2 rounded mr-4">구글 시트에 배포 저장</button>
              <button onClick={() => { setIsTeacher(false); setView('login'); }} className="bg-red-500 text-white font-bold px-4 py-2 rounded">로그아웃</button>
            </div>
          </nav>
          
          <div className="flex">
            <aside className="w-48 bg-white min-h-screen border-r-2 border-black font-bold">
              <button onClick={()=>setTab('settings')} className={`w-full text-left p-4 ${tab==='settings'?'bg-blue-100':''}`}>설정 / 연동</button>
              <button onClick={()=>setTab('questions')} className={`w-full text-left p-4 ${tab==='questions'?'bg-blue-100':''}`}>문항 및 루브릭 ({activeSession})</button>
              <button onClick={()=>setTab('students')} className={`w-full text-left p-4 ${tab==='students'?'bg-blue-100':''}`}>학생 결과 ({activeSession})</button>
            </aside>
            <main className="flex-1 p-8">
              
              {tab === 'settings' && (
                <div className="bg-white p-8 rounded-xl shadow border-2 border-black max-w-2xl">
                  <h2 className="text-2xl font-bold mb-6">설정 및 연동 관리</h2>
                  <div className="mb-6">
                    <label className="block font-bold mb-2">페이지 제목 (초기값: 인공지능 수학 수행평가)</label>
                    <input type="text" value={settings.title} onChange={e => setSettings({...settings, title: e.target.value})} className="w-full p-2 border-2 border-black outline-none font-bold" />
                  </div>
                  <div className="mb-6 border-b-2 pb-6">
                    <label className="block font-bold mb-2">평가 회차 목록 관리</label>
                    <div className="flex gap-2 flex-wrap mb-2">
                      {settings.sessions.map(s => <span key={s} className="bg-gray-200 px-3 py-1 rounded font-bold">{s}</span>)}
                    </div>
                    <button onClick={handleAddSession} className="bg-blue-500 text-white px-4 py-2 rounded font-bold mr-2">+ 새 회차 추가</button>
                    <button onClick={handleDelSession} className="bg-red-500 text-white px-4 py-2 rounded font-bold">현재 회차 삭제</button>
                  </div>
                  <div className="mb-6">
                    <label className="block font-bold mb-2">교사 비밀번호 (시트 동기화됨)</label>
                    <input type="text" value={settings.password} onChange={e => setSettings({...settings, password: e.target.value})} className="w-full p-2 border-2 border-black outline-none" />
                  </div>
                  <div className="mb-6">
                    <label className="block font-bold mb-2 text-blue-600">Google Apps Script URL (기기에만 저장됨)</label>
                    <input type="text" value={settings.gasUrl} onChange={e => setSettings({...settings, gasUrl: e.target.value})} className="w-full p-2 border-2 border-blue-600 outline-none" placeholder="https://script.google.com/macros/s/.../exec" />
                    <p className="text-sm mt-2 text-gray-500">* 해가 바뀌면 이 주소만 새로운 구글 시트 주소로 교체하세요.</p>
                  </div>
                </div>
              )}

              {tab === 'questions' && (
                <div>
                  <div className="flex gap-4 mb-6">
                    <button onClick={() => handleAddQuestion('count')} className="bg-blue-500 text-white font-bold py-2 px-4 rounded shadow-md border-2 border-black">+ 선택형(개수 채점) 추가</button>
                    <button onClick={() => handleAddQuestion('value')} className="bg-green-500 text-white font-bold py-2 px-4 rounded shadow-md border-2 border-black">+ 직접입력형(값 채점) 추가</button>
                  </div>
                  {questions.map((q, qIndex) => (
                    <div key={q.id} className="bg-white p-6 rounded-xl shadow border-2 border-black mb-8 relative">
                      <span className="absolute -top-4 -left-4 bg-yellow-300 border-2 border-black font-black w-8 h-8 flex items-center justify-center rounded-full rotate-[-10deg]">{qIndex+1}</span>
                      <span className="absolute top-2 right-2 bg-gray-200 text-xs px-2 py-1 rounded font-bold border border-gray-400">{q.type === 'value' ? '직접입력형' : '단어선택형'}</span>
                      <div className="flex justify-between items-start mb-4 mt-2">
                        <input type="text" value={q.title} onChange={e => {
                          const newConfig = {...configBySession};
                          newConfig[activeSession].questions[qIndex].title = e.target.value;
                          setConfigBySession(newConfig);
                        }} className="text-xl font-bold border-b-2 border-gray-300 w-3/4 outline-none" placeholder="제목/평가요소 입력" />
                        <button onClick={() => handleDeleteQuestion(q.id)} className="text-red-500 font-bold underline">삭제</button>
                      </div>
                      <textarea value={q.content} onChange={e => {
                        const newConfig = {...configBySession};
                        newConfig[activeSession].questions[qIndex].content = e.target.value;
                        setConfigBySession(newConfig);
                      }} className="w-full p-2 border-2 border-black mb-2 h-24 outline-none" placeholder="내용을 입력하세요. 빈칸은 {{단어}} 형태로 만드세요." />
                      
                      {q.type === 'count' && (
                        <div className="mb-4">
                          <label className="font-bold text-sm text-gray-600 block mb-1">보기 (쉼표로 구분)</label>
                          <input type="text" value={(q.options || []).join(', ')} onChange={e => {
                            const newConfig = {...configBySession};
                            newConfig[activeSession].questions[qIndex].options = e.target.value.split(',').map(s=>s.trim()).filter(s=>s);
                            setConfigBySession(newConfig);
                          }} className="w-full p-2 border-2 border-black outline-none" />
                        </div>
                      )}

                      <div className="bg-gray-50 p-4 border border-gray-300 rounded">
                        <h4 className="font-bold mb-2">루브릭 (채점 기준)</h4>
                        {(rubrics[q.id] || []).map((r, rIndex) => (
                          <div key={rIndex} className="flex gap-2 items-center mb-2">
                            {q.type === 'value' ? (
                              <React.Fragment>
                                <input type="text" value={r.matchValue} onChange={e => {
                                  const newConfig = {...configBySession};
                                  newConfig[activeSession].rubrics[q.id][rIndex].matchValue = e.target.value;
                                  setConfigBySession(newConfig);
                                }} className="w-24 p-1 border border-black" placeholder="정답값" />
                                <span className="font-bold text-sm">와 일치하면</span>
                              </React.Fragment>
                            ) : (
                              <React.Fragment>
                                <input type="number" value={r.min} onChange={e => {
                                  const newConfig = {...configBySession};
                                  newConfig[activeSession].rubrics[q.id][rIndex].min = Number(e.target.value);
                                  setConfigBySession(newConfig);
                                }} className="w-16 p-1 border border-black" /> 개 ~ 
                                <input type="number" value={r.max} onChange={e => {
                                  const newConfig = {...configBySession};
                                  newConfig[activeSession].rubrics[q.id][rIndex].max = Number(e.target.value);
                                  setConfigBySession(newConfig);
                                }} className="w-16 p-1 border border-black" /> 개 맞히면
                              </React.Fragment>
                            )}
                            <input type="text" value={r.grade} onChange={e => {
                              const newConfig = {...configBySession};
                              newConfig[activeSession].rubrics[q.id][rIndex].grade = e.target.value;
                              setConfigBySession(newConfig);
                            }} className="w-16 p-1 border border-black ml-4" placeholder="등급" /> 등급,
                            <input type="number" value={r.score} onChange={e => {
                              const newConfig = {...configBySession};
                              newConfig[activeSession].rubrics[q.id][rIndex].score = Number(e.target.value);
                              setConfigBySession(newConfig);
                            }} className="w-16 p-1 border border-black" /> 점
                            <button onClick={() => {
                              const newConfig = {...configBySession};
                              newConfig[activeSession].rubrics[q.id].splice(rIndex, 1);
                              setConfigBySession(newConfig);
                            }} className="ml-auto text-red-500 font-bold text-sm bg-gray-200 px-2 rounded hover:bg-gray-300">X</button>
                          </div>
                        ))}
                        <button onClick={() => {
                          const newConfig = {...configBySession};
                          if (!newConfig[activeSession].rubrics[q.id]) {
                            newConfig[activeSession].rubrics[q.id] = [];
                          }
                          if (q.type === 'value') {
                            newConfig[activeSession].rubrics[q.id].push({ matchValue: '입력', grade: 'C', score: 0 });
                          } else {
                            newConfig[activeSession].rubrics[q.id].push({ min: 0, max: 0, grade: 'C', score: 0 });
                          }
                          setConfigBySession(newConfig);
                        }} className="text-sm font-bold bg-white border-2 border-black px-3 py-1 rounded mt-2">+ 기준 추가</button>
                      </div>
                    </div>
                  ))}
                </div>
              )}

              {tab === 'students' && (
                <div className="bg-white p-6 rounded-xl shadow border-2 border-black">
                  <div className="flex justify-between items-center mb-6">
                    <h2 className="text-2xl font-bold">학생 결과 모아보기 ({activeSession})</h2>
                    {isLoadingData && <span className="text-blue-500 font-bold animate-pulse">구글 시트에서 불러오는 중...</span>}
                  </div>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead>
                        <tr className="bg-gray-200">
                          <th className="p-3 border-2 border-black">학번</th>
                          <th className="p-3 border-2 border-black">이름</th>
                          {questions.map((q, i) => (
                            <th key={q.id} className="p-3 border-2 border-black text-center whitespace-nowrap">Q{i+1}</th>
                          ))}
                          <th className="p-3 border-2 border-black text-blue-600">총점</th>
                          <th className="p-3 border-2 border-black">제출시간</th>
                          <th className="p-3 border-2 border-black text-center text-red-500">관리</th>
                        </tr>
                      </thead>
                      <tbody>
                        {students.length === 0 ? (
                          <tr><td colSpan={5 + questions.length} className="text-center p-8 text-gray-500 font-bold border-2 border-black">제출된 데이터가 없습니다.</td></tr>
                        ) : (
                          students.slice().reverse().map((s, i) => (
                            <tr key={i} className="hover:bg-blue-50 cursor-pointer border-2 border-black">
                              <td className="p-3 border-2 border-black font-bold">{s.id}</td>
                              <td className="p-3 border-2 border-black">{s.name}</td>
                              {questions.map((q) => {
                                const qRes = s.results && s.results[q.id];
                                const score = (qRes && qRes.scoreInfo) ? qRes.scoreInfo.score : '-';
                                return <td key={q.id} className="p-3 border-2 border-black text-center font-bold text-gray-700">{score}</td>;
                              })}
                              <td className="p-3 border-2 border-black text-blue-600 font-black text-lg text-center">{s.totalScore}점</td>
                              <td className="p-3 border-2 border-black text-sm text-gray-500">{s.timestamp}</td>
                              <td className="p-3 border-2 border-black text-center">
                                <button onClick={(e) => handleDeleteStudent(s.id, e)} className="bg-red-500 text-white font-bold px-3 py-1 border-2 border-black rounded shadow-[2px_2px_0_0_rgba(0,0,0,1)] hover:bg-red-600 hover:translate-y-0.5 hover:shadow-none transition-all text-sm">
                                  삭제
                                </button>
                              </td>
                            </tr>
                          ))
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
